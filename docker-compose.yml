services:
  db:
    image: postgres:17-alpine            # pinned major version; alpine = small image
    container_name: pg_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wishing_tree_db
    ports:
      - "127.0.0.1:5432:5432"   # localhost only, not exposed to your LAN
    volumes:
      - pgdata:/var/lib/postgresql/data           # named volume: data survives container removal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wishing_tree_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: