<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320">
  <defs>
    <radialGradient id="fur" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#e3c48f"/>
      <stop offset="0.65" stop-color="#c9a066"/>
      <stop offset="1" stop-color="#a27a45"/>
    </radialGradient>
    <radialGradient id="face" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#fbe2cc"/>
      <stop offset="1" stop-color="#e9b896"/>
    </radialGradient>
    <radialGradient id="peach" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.5" stop-color="#f8b26a"/>
      <stop offset="1" stop-color="#e86f6f"/>
    </radialGradient>
  </defs>
  <g stroke="#5b4636" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail curling along the ground -->
    <path d="M70 262 C30 270 14 300 40 308 C66 314 76 292 58 286" fill="none" stroke="#8a6537" stroke-width="7"/>
    <path d="M70 262 C30 270 14 300 40 308 C66 314 76 292 58 286" fill="none" stroke="#c9a066" stroke-width="3.5"/>
    <!-- seated body -->
    <path d="M92 148 C70 176 64 236 82 270 C98 296 160 302 186 282 C206 266 206 214 192 180 C180 152 120 132 92 148 Z" fill="url(#fur)"/>
    <!-- haunch and foot -->
    <path d="M150 232 C186 228 214 250 210 278 C206 298 176 304 150 298 C134 294 128 276 136 262 Z" fill="url(#fur)"/>
    <path d="M168 296 C186 300 214 300 226 292 C230 284 222 280 212 282 C200 286 184 286 172 284 Z" fill="url(#face)"/>
    <!-- belly -->
    <path d="M120 180 C108 204 110 248 128 268 C146 276 164 262 166 236 C168 206 150 180 120 180 Z" fill="#ead2a8" stroke="none"/>
    <!-- far arm reaching to the mouth -->
    <path d="M176 170 C204 168 220 150 222 128 C216 122 206 124 202 132 C198 148 186 156 168 158 Z" fill="url(#fur)"/>
    <!-- head -->
    <path d="M110 70 C120 30 196 26 214 66 C226 94 218 128 196 142 C172 156 128 152 112 128 C102 112 102 90 110 70 Z" fill="url(#fur)"/>
    <!-- ear -->
    <path d="M110 84 C92 78 84 96 92 108 C100 118 112 114 114 104" fill="url(#face)"/>
    <!-- face mask -->
    <path d="M150 62 C176 54 210 66 214 92 C218 120 200 140 176 142 C152 144 138 128 140 108 C126 98 132 70 150 62 Z" fill="url(#face)"/>
    <!-- brows, eyes, nose, mouth -->
    <path d="M156 84 C164 76 176 76 182 82 M190 82 C196 76 206 78 210 84" fill="none" stroke-width="2.2"/>
    <circle cx="170" cy="92" r="3.6" fill="#2b2119" stroke="none"/>
    <circle cx="200" cy="92" r="3.6" fill="#2b2119" stroke="none"/>
    <path d="M186 104 C188 110 194 110 196 104" fill="none" stroke-width="2"/>
    <path d="M176 122 C186 128 200 128 208 120" fill="none" stroke-width="2"/>
    <!-- near arm holding the peach -->
    <path d="M118 172 C126 196 152 204 182 196 C196 192 204 182 202 172 C190 170 178 176 168 180 C152 182 138 176 132 162 Z" fill="url(#fur)"/>
    <!-- peach with leaves -->
    <path d="M214 160 C226 146 242 148 244 160 C232 168 222 166 214 160 Z" fill="#6ea35a"/>
    <path d="M206 158 C196 144 182 146 180 156 C190 164 200 164 206 158 Z" fill="#5c8f4b"/>
    <circle cx="214" cy="180" r="19" fill="url(#peach)"/>
    <path d="M214 162 C208 172 208 188 214 198" fill="none" stroke="#e0806b" stroke-width="1.6"/>
    <!-- fingers over the fruit -->
    <path d="M196 186 C200 182 206 184 206 190 M198 196 C202 192 208 194 208 200" fill="none" stroke-width="2"/>
    <!-- painted fur strokes -->
    <g fill="none" stroke="#a27a45" stroke-width="1.8">
      <path d="M90 200 C96 194 102 194 106 198 M86 228 C92 222 100 222 104 226 M120 52 C128 46 136 46 142 50"/>
    </g>
  </g>
</svg>
