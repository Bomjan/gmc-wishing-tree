    <path d="M150 168 C118 150 92 116 70 104 C48 92 26 104 30 122 C34 136 50 134 50 124 C58 118 78 126 96 140 C116 156 134 170 148 176 Z" fill="#3b7fc4"/>
    <path d="M152 176 C118 178 74 168 46 178 C20 188 14 214 32 220 C46 224 54 210 44 204 C58 194 92 194 124 188 C136 186 146 182 152 182 Z" fill="#d9434f"/>
    <path d="M156 184 C130 200 104 228 80 236 C58 244 50 266 66 272 C80 276 88 262 78 258 C92 248 118 234 140 214 C148 206 154 196 158 190 Z" fill="#3f9a6b"/>
    <path d="M148 162 C130 132 122 96 104 72 C92 56 72 58 72 72 C72 84 86 86 88 78 C100 90 110 120 124 148 C132 160 140 168 146 170 Z" fill="#f2c94c"/>
    <g fill="none" stroke-width="1.3">
      <path d="M146 172 C120 154 96 126 64 112" stroke="#d6e7f6"/>
      <path d="M148 180 C114 184 80 182 48 194" stroke="#fbd0d4"/>
      <path d="M154 188 C130 206 106 228 82 248" stroke="#d6efe0"/>
      <path d="M144 166 C130 140 118 106 96 80" stroke="#fff1bf"/>
