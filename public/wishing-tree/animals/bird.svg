<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280">
  <defs>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fbd8d2"/>
      <stop offset="0.5" stop-color="#f19aa0"/>
      <stop offset="1" stop-color="#d65a72"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0" stop-color="#f6b9bf"/>
      <stop offset="0.55" stop-color="#fdeef0"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <g stroke="#5b4636" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
